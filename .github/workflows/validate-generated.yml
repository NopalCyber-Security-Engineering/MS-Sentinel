name: Validate Generated Sentinel Content

on:
  push:
    branches: [main]
    paths:
      - 'Clients/**'
      - '_build/**'
      - 'scripts/validate_generated.py'
      - '.github/workflows/validate-generated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate generated ARM content
        run: python scripts/validate_generated.py
